<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test écran NGBrowser</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141922;
    --ink: #f2f5f9;
    --muted: #7f8ea3;
    --accent: #35d07f;
    --edge: #232b38;
    --radius: 14px;
    --mono: ui-monospace, Consolas, "SF Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: sans-serif;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 { font-size: 22px; }
  .badge {
    display: inline-block;
    background: rgba(53, 208, 127, 0.15);
    color: var(--accent);
    font-weight: bold;
    padding: 8px 16px;
    border-radius: 8px;
    width: fit-content;
  }
  .badge.off { background: rgba(255, 80, 80, 0.15); color: #ff5050; }
  .card {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    padding: 18px 22px;
  }
  .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .value { font-size: 26px; font-weight: bold; }
  .sub { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-top: 6px; }
  .identity-row { display: flex; gap: 24px; margin-top: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 13px; }
  .identity-row b { color: var(--ink); }
  .commands { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .cmd-row {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--edge);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 14px;
  }
  .cmd-action { color: #4fa8ff; font-weight: bold; }
  .cmd-time { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

  <h1>Test écran NGBrowser</h1>
  <div class="badge off" id="bridge-badge">bridge non connecté</div>

  <div class="card">
    <div class="label">Screen ID</div>
    <div class="value" id="screen-id">…</div>
    <div class="sub" id="bridge-version">version du bridge : …</div>
  </div>

  <div class="card">
    <div class="label">Identité (NG-Identity)</div>
    <div class="value" id="identity-name">…</div>
    <div class="identity-row">
      <span>sub <b id="identity-sub">…</b></span>
      <span>iss <b id="identity-iss">…</b></span>
      <span>aud <b id="identity-aud">…</b></span>
      <span>expire dans <b id="identity-expire">…</b></span>
    </div>
  </div>

  <div class="card">
    <div class="label">Commandes reçues</div>
    <div class="commands" id="commands-list"></div>
  </div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var identityPayload = null;

  function readIdentity() {
    var tok = window.ngScreen && window.ngScreen.identity;
    if (!tok) return null;
    try {
      var p = tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      while (p.length % 4) p += '=';
      return JSON.parse(decodeURIComponent(escape(atob(p))));
    } catch (e) { return null; }
  }

  function renderIdentity() {
    identityPayload = readIdentity();
    if (!identityPayload) {
      $('identity-name').textContent = 'invité (aucune identité)';
      $('identity-sub').textContent = '—';
      $('identity-iss').textContent = '—';
      $('identity-aud').textContent = '—';
      $('identity-expire').textContent = '—';
      return;
    }
    $('identity-name').textContent = identityPayload.name || '—';
    $('identity-sub').textContent = identityPayload.sub || '—';
    $('identity-iss').textContent = identityPayload.iss || '—';
    $('identity-aud').textContent = identityPayload.aud || '—';
  }

  function updateExpireCountdown() {
    if (!identityPayload || !identityPayload.exp) {
      $('identity-expire').textContent = '—';
      return;
    }
    var remaining = identityPayload.exp - Math.floor(Date.now() / 1000);
    $('identity-expire').textContent = remaining > 0 ? remaining + 's' : 'expiré';
  }

  function addCommandRow(evt) {
    var row = document.createElement('div');
    row.className = 'cmd-row';

    var left = document.createElement('span');
    left.innerHTML = '<span class="cmd-action">' + escapeHtml(evt.action) + '</span> ' +
      escapeHtml(JSON.stringify(evt.args || []));

    var time = document.createElement('span');
    time.className = 'cmd-time';
    time.textContent = new Date().toLocaleTimeString();

    row.appendChild(left);
    row.appendChild(time);
    $('commands-list').prepend(row);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  (function wait() {
    if (!window.ngScreen) { return setTimeout(wait, 200); }

    $('bridge-badge').textContent = 'bridge connecté';
    $('bridge-badge').classList.remove('off');

    $('screen-id').textContent = window.ngScreen.screenId || '—';
    $('bridge-version').textContent = 'version du bridge : ' + (window.ngScreen.version || '1');

    renderIdentity();
    setInterval(renderIdentity, 2000);
    setInterval(updateExpireCountdown, 1000);

    window.ngScreen.onCommand(function (evt) {
      addCommandRow(evt);
    });
  })();
})();
</script>

</body>
</html>
